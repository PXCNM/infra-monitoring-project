name: CI

on:
  pull_request:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Test check_api.sh
        run: ./check_api.sh https://httpbin.org/status/200